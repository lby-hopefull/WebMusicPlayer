  <symbol class="bi bi-file-earmark-text" viewBox="0 0 16 16" id="file-earmark-text"><path d="M5.5 7a.5.5 0 0 0 0 1h5a.5.5 0 0 0 0-1zM5 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0 2a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5"/><path d="M9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.5zm0 1v2A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/></symbol>
  <symbol class="bi bi-image" viewBox="0 0 16 16" id="image"><path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/><path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1z"/></symbol>
  <symbol class="bi bi-dash-lg" viewBox="0 0 16 16" id="dash-lg"><path fill-rule="evenodd" d="M2 8a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11A.5.5 0 0 1 2 8"/></symbol>
  <symbol class="bi bi-plus-lg" viewBox="0 0 16 16" id="plus-lg"><path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/></symbol>
</svg>
<!-- ICONS:END -->

<div class="page-container">

<!-- 播放器页面 -->
<section id="page-player" class="active">
  <div id="player-swiper">
    <!-- 第一页：封面 + 播放面板 -->
    <div class="player-page" id="player-page-cover">
      <div id="albumCover">
        <img id="coverImage" alt="专辑封面" style="display:none;">
        <span id="coverPlaceholder">
          <svg class="icon" aria-hidden="true"><use href="#music-note-beamed"/></svg>
          <span>暂无封面</span>
        </span>
      </div>

      <!-- 播放面板：竖屏排在封面下方；横屏（宽度较大）排在封面右侧。
           面板内部顺序固定为「上：标题·歌手·总时长·进度条，下：播放控制·播放模式·音量」 -->
      <div class="player-panel">
        <div id="progressSection">
          <div id="trackInfo">
            <div id="trackDetails">
              <div id="songTitle">选择歌曲播放</div>
              <!-- 歌手与播放时间同处一行：左侧歌手（过长省略号），右侧时间贴边 -->
              <div id="trackSub">
                <span id="songArtistAlbum"></span>
                <span id="trackProgress">00:00 / 00:00</span>
              </div>
            </div>
          </div>
          <input type="range" id="progressBar" value="0" min="0" max="100" step="0.01" aria-label="播放进度">
        </div>

        <div class="controls-row">
          <div class="play-mode-section">
            <label for="playMode">播放模式：</label>
            <select id="playMode" aria-label="播放模式">
              <option value="sequential">顺序</option>
              <option value="loop">单曲循环</option>
              <option value="random" selected>随机</option>
            </select>
          </div>
          <div class="controls-buttons">
            <button id="prevBtn" type="button" class="player-btn" aria-label="上一首">
              <svg class="icon" aria-hidden="true"><use href="#skip-backward-fill"/></svg>
            </button>
            <button id="playPauseBtn" type="button" class="player-btn player-btn-main" aria-label="播放">
              <svg class="icon" aria-hidden="true"><use href="#play-fill"/></svg>
            </button>
            <button id="nextBtn" type="button" class="player-btn" aria-label="下一首">
              <svg class="icon" aria-hidden="true"><use href="#skip-forward-fill"/></svg>
            </button>
          </div>
          <div class="volume-section">
            <label for="volumeSlider">音量：</label>
            <!-- --fill-ratio 是已播放/已调整比例的初始值（0~1），与 value 保持一致：
                 JS 起来之前先按这个静态值画，避免首帧显示 0% 再跳变 -->
            <input type="range" id="volumeSlider" value="100" min="0" max="100" aria-label="音量" style="--fill-ratio: 1">
            <span id="volumeValue">100</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 第二页：播放队列 -->
    <div class="player-page" id="player-page-queue">
      <div class="queue-header">
        <h3>当前播放队列</h3>
        <button id="shuffleBtn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#shuffle"/></svg>
          随机排序
        </button>
      </div>
      <div id="playlist"></div>
    </div>
  </div>

  <!-- 歌词界面 -->
  <div id="lyricsContainer">
    <div id="lyricDelayControl">
      <span>歌词延迟：</span>
      <button id="lyricDelayMinus" type="button" aria-label="歌词延迟减少 0.05 秒">
        <svg class="icon" aria-hidden="true"><use href="#dash-lg"/></svg>
      </button>
      <span id="lyricDelayValue">0.00s</span>
      <button id="lyricDelayPlus" type="button" aria-label="歌词延迟增加 0.05 秒">
        <svg class="icon" aria-hidden="true"><use href="#plus-lg"/></svg>
      </button>
    </div>
  </div>
  <button id="coverLyricToggle" type="button" aria-label="切换到歌词界面">
    <svg class="icon" aria-hidden="true"><use href="#file-earmark-text"/></svg>
    <span id="coverLyricToggleLabel">显示歌词</span>
  </button>
</section>

<!-- 歌曲列表页面 -->
<section id="page-lists">
  <h3>自建歌单</h3>
  <div class="sort-bar">
    <label for="listSortKey">排序：</label>
    <select id="listSortKey" aria-label="歌曲列表排序方式">
      <option value="name">名称</option>
      <option value="duration">歌曲时长</option>
      <option value="addedTime">添加时间</option>
      <option value="size">文件大小</option>
    </select>
    <select id="listSortDir" aria-label="歌曲列表排序方向">
      <option value="asc">升序</option>
      <option value="desc">降序</option>
    </select>
  </div>
  <div class="new-list-row">
    <input id="newListName" placeholder="新歌单名" aria-label="新歌单名称">
    <button id="createListBtn" type="button">创建</button>
  </div>
  <div id="customLists"></div>
</section>

<!-- 统计页面 -->
<section id="page-stats">
  <h3>播放统计</h3>
  <div id="stats"></div>
</section>

<!-- 设置页面 -->
<section id="page-settings">
  <div class="settings-container">
    <!-- 通用设置：所有分组默认折叠，避免一进设置页就铺满屏幕 -->
    <details class="settings-section">
      <summary class="settings-section-title">
        <svg class="icon section-icon" aria-hidden="true"><use href="#palette"/></svg>
        <span>外观</span>
        <svg class="icon section-chevron" aria-hidden="true"><use href="#chevron-right"/></svg>
      </summary>
      <div class="settings-section-content">
        <div class="settings-row">
          <div class="settings-label-group">
            <label for="themeMode" class="settings-label">主题模式</label>
            <span class="settings-hint">选择你偏好的配色方案</span>
          </div>
          <div class="settings-control">
            <div class="theme-selector">
              <button type="button" class="theme-option" data-theme="light" aria-label="浅色主题">
                <svg class="icon theme-icon" aria-hidden="true"><use href="#sun-fill"/></svg>
                <span class="theme-name">浅色</span>
              </button>
              <button type="button" class="theme-option" data-theme="dark" aria-label="深色主题">
                <svg class="icon theme-icon" aria-hidden="true"><use href="#moon-stars-fill"/></svg>
                <span class="theme-name">深色</span>
              </button>
              <button type="button" class="theme-option active" data-theme="system" aria-label="跟随系统">
                <svg class="icon theme-icon" aria-hidden="true"><use href="#display"/></svg>
                <span class="theme-name">自动</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </details>

    <!-- 音乐管理 -->
    <details class="settings-section">
      <summary class="settings-section-title">
        <svg class="icon section-icon" aria-hidden="true"><use href="#music-note-beamed"/></svg>
        <span>音乐管理</span>
        <svg class="icon section-chevron" aria-hidden="true"><use href="#chevron-right"/></svg>
      </summary>
      <div class="settings-section-content">
        <div class="manage-actions">
          <button id="refreshListBtn" type="button">
            <svg class="icon" aria-hidden="true"><use href="#arrow-repeat"/></svg>
            刷新
          </button>
          <button id="addFolderBtn" type="button" class="btn-success">
            <svg class="icon" aria-hidden="true"><use href="#folder2-open"/></svg>
            添加文件夹
          </button>
          <input type="file" id="localFolderInput" webkitdirectory directory multiple style="display:none;">
          <button id="selectAllBtn" type="button">
            <svg class="icon" aria-hidden="true"><use href="#check2-square"/></svg>
            全选
          </button>
          <button id="deselectAllBtn" type="button">
            <svg class="icon" aria-hidden="true"><use href="#square"/></svg>
            取消全选
          </button>
          <button id="downloadSelectedBtn" type="button">
            <svg class="icon" aria-hidden="true"><use href="#download"/></svg>
            下载选中
          </button>
          <button id="downloadAllBtn" type="button">
            <svg class="icon" aria-hidden="true"><use href="#cloud-download"/></svg>
            全部下载
          </button>
          <button id="deleteSelectedBtn" type="button" class="btn-danger">
            <svg class="icon" aria-hidden="true"><use href="#trash3"/></svg>
            删除
          </button>
          <button id="clearCacheBtn" type="button" class="btn-warning">
            <svg class="icon" aria-hidden="true"><use href="#eraser"/></svg>
            清理缓存
          </button>
        </div>

        <div class="manage-info">
          <span id="selectedCount">已选择： 0</span>
          <span id="cachedCount">已缓存： 0</span>
        </div>

        <div class="sort-bar">
          <label for="manageSortKey">排序：</label>
          <select id="manageSortKey" aria-label="管理列表排序方式">
            <option value="name">名称</option>
            <option value="duration">时长</option>
            <option value="addedTime">添加时间</option>
            <option value="size">大小</option>
          </select>
          <select id="manageSortDir" aria-label="管理列表排序方向">
            <option value="asc">升序</option>
            <option value="desc">降序</option>
          </select>
        </div>

        <div class="progress-container" id="progressContainer" style="display: none;">
          <div id="progressText">进度： 0/0</div>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressBarFill"></div>
          </div>
        </div>

        <!-- 扁平歌曲列表：自身没有边框和滚动，跟着设置页整页滚动，不会出现第二条滚动条 -->
        <div id="manageSongList"></div>
      </div>
    </details>
  </div>
</section>

</div>

<dialog id="songDialog">
  <h3>选择要添加的歌曲</h3>
  <div id="dialogSongList"></div>
  <div class="dialog-footer">
    <button id="confirmAddSongsBtn" type="button">确认</button>
    <button id="cancelAddSongsBtn" type="button" class="dialog-btn-cancel">取消</button>
  </div>
</dialog>

<div class="navbar">
  <button id="navPlayer" type="button">
    <svg class="icon" aria-hidden="true"><use href="#play-circle"/></svg>
    <span>播放器</span>
  </button>
  <button id="navLists" type="button">
    <svg class="icon" aria-hidden="true"><use href="#music-note-list"/></svg>
    <span>歌曲列表</span>
  </button>
  <button id="navStats" type="button">
    <svg class="icon" aria-hidden="true"><use href="#bar-chart-line"/></svg>
    <span>统计</span>
  </button>
  <button id="navSettings" type="button">
    <svg class="icon" aria-hidden="true"><use href="#gear"/></svg>
    <span>设置</span>
  </button>
</div>

</body>
</html>
